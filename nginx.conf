server {
    listen 80;
    server_name _;

    js_path "/etc/nginx/conf.d/";
    js_import auth from auth.js;

    location / {
        auth_request /_auth_check;
	error_page 401 = @error401;

        # ==========================================
        # 1. 隐藏网页上的按钮
        # ==========================================
        # 注意：你需要按 F12 看看你实际网页里那个按钮的 HTML 是什么。
        sub_filter_once off;

        # 1. 干掉 CDN
        sub_filter 'https://cdn.jsdelivr.net' 'http://127.0.0.1:1';

        # 2. 隐藏所有不需要的列和按钮（包含 COPY 按钮）
        sub_filter 'id="settings-toggle"' 'id="settings-toggle" style="display: none !important;"';
        sub_filter 'class="act-btn act-zip"' 'class="act-btn act-zip" style="display: none !important;"';
        sub_filter 'class="act-btn act-dl"' 'class="act-btn act-dl" style="display: none !important;"';
        sub_filter 'class="act-btn act-copy"' 'class="act-btn act-copy" style="display: none !important;"';
        sub_filter 'class="act-copy"' 'class="act-copy" style="display: none !important;"';
        
        sub_filter '<div class="arch-filter">' '<div class="arch-filter" style="display: none !important;">';
        sub_filter '<div class="ext-filter">' '<div class="ext-filter" style="display: none !important;">';
        
        # 隐藏图标列
        sub_filter '<th class="col-icon">' '<th class="col-icon" style="display: none !important;">';
        sub_filter '<td class="col-icon">' '<td class="col-icon" style="display: none !important;">';

        # 隐藏 TYPE, MODIFIED, NAME, SIZE 列
        sub_filter '<th class="col-ext">' '<th class="col-ext" style="display: none !important;">';
        sub_filter '<td class="col-ext">' '<td class="col-ext" style="display: none !important;">';
        sub_filter '<th class="col-mtime' '<th class="col-mtime hidden-col" style="display: none !important;" ';
        sub_filter '<td class="col-mtime' '<td class="col-mtime" style="display: none !important;" ';
        sub_filter '<th class="col-name' '<th class="col-name" style="display: none !important;" ';
        sub_filter '<td class="col-name' '<td class="col-name" style="display: none !important;" ';
        sub_filter '<th class="col-size' '<th class="col-size" style="display: none !important;" ';
        sub_filter '<td class="col-size' '<td class="col-size" style="display: none !important;" ';

        # 3. 注入 CSS 和 修改 DOM 的 JS
        sub_filter '</head>' '
        <style>
            #preview-overlay { display: none !important; } 
            footer { display: none !important; }
            
            /* 欺骗浏览器：表头还在，占位，但是看不见 */
            .results-table thead {
                visibility: hidden !important;
            }
            .results-table thead tr {
                height: 0 !important;
                line-height: 0 !important;
            }
            .results-table thead th {
                padding: 0 !important;
                margin: 0 !important;
                font-size: 0 !important;
                border: none !important;
            }

            /* 强制自动换行 */
            .results-table td.col-path {
                width: 95vw !important;
                max-width: 95vw !important;
                white-space: normal !important; 
                word-break: break-all !important; 
                overflow-wrap: anywhere !important;
            }
            .results-table td.col-path span,
            .results-table td.col-path span * {
                white-space: normal !important; 
                word-break: break-all !important; 
                overflow-wrap: anywhere !important;
            }
            
            /* 滚动布局 */
            html, body { height: 100vh !important; overflow: hidden !important; margin: 0 !important; padding: 0 !important; }
            main { display: flex !important; flex-direction: column !important; height: 100vh !important; overflow: hidden !important; }
            .search-bar, .toolbar, .results-header { flex-shrink: 0 !important; background-color: var(--bg-color, #18181b) !important; z-index: 999 !important; }
            #type-filters { display: none !important; }
            #results-container { flex-grow: 1 !important; overflow-y: auto !important; padding-bottom: 10px !important; min-height: 0 !important; max-height: 100% !important; }
            #results-container table { height: auto !important; display: table !important; }
            #results-container::-webkit-scrollbar { width: 8px !important; }
            #results-container::-webkit-scrollbar-thumb { background: #555 !important; border-radius: 4px !important; }
        </style>
        <script>
            setInterval(() => {
                document.querySelectorAll(".results-table tbody tr").forEach(tr => {
                    const span = tr.querySelector("td.col-path span");
                    if (span) {
                        let text = span.getAttribute("title") || span.innerText;
                        // 用极其简单的字符串替换，不包含反斜杠和单引号
                        let cleanText = text.replace(/^\/~0~\//, "/");
                        
                        if (span.textContent !== cleanText) {
                            span.textContent = cleanText;
                            span.setAttribute("title", cleanText);
                        }
                    }
                });
            }, 500);
        </script>
        </head>';

        proxy_pass http://nasearch:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding ""; 
    }

    # ==========================================
    # 2. 彻底封死修改配置和重建索引的接口
    # ==========================================
    location ~ ^/(api/settings|api/reindex|api/zip|api/download) {
        return 403;
    }

    location = /_auth_check {
        internal;
        js_content auth.verify;
    }

    location = /_auth_api {
        internal;
        proxy_pass http://your-auth-api:8706/api/verifyUser;
        proxy_method POST;
        proxy_pass_request_body on;
        
        # 修复：删掉了错误的 Content-Length "" 设置，让 Nginx 自动处理
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_set_header Host $host;
    }

    location @error401 {
        add_header WWW-Authenticate 'Basic realm="NASearch"' always;
        return 401;
    }
}
